[project]
name = "clawteam"
version = "0.3.0"
description = "Framework-agnostic multi-agent coordination CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "HKUDS", email = "jiabintang77@gmail.com"}
]
keywords = ["ai", "agent", "multi-agent", "team", "coordination", "cli", "swarm", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "rich>=13.0.0,<15.0.0",
    "questionary>=2.0.1,<3.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "ruff>=0.1.0",
    # PyYAML is consumed ONLY by clawteam.team.envelope.parse_frontmatter which is
    # scoped to sprint-scope envelope validation (Plan 02-02 / Plan 02-07 /
    # Plan 02-08). Kept in dev deps so Phase 2 holds the PROJECT.md constraint
    # "no new required runtime deps for core harness extensions": production
    # deployments that do not exercise gstack-sprint envelope validation do not
    # need PyYAML at import time (the envelope module itself imports yaml at
    # top level, so any callsite of parse_frontmatter/validate_envelope must
    # have dev deps installed; non-sprint-scope code never imports envelope).
    "pyyaml>=6.0,<7.0",
]
p2p = [
    "pyzmq>=25.0.0,<27.0.0",
]
# Phase 6 Wave 0 (D-01): headless Chromium for /browse, /open-gstack-browser,
# /setup-browser-cookies, and optional screenshotting in /design-shotgun.
# Post-install: user runs `playwright install chromium` (never auto).
browser = [
    "playwright>=1.58,<2",
]

[project.scripts]
clawteam = "clawteam.cli.commands:app"
clawteam-mcp = "clawteam.mcp.server:main"

[project.urls]
Homepage = "https://github.com/HKUDS/ClawTeam"
Repository = "https://github.com/HKUDS/ClawTeam"
Issues = "https://github.com/HKUDS/ClawTeam/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clawteam"]

[tool.hatch.build.targets.sdist]
include = [
    "clawteam/",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
