<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Variant 2 — Editorial Serif</title>
<style>
  body {
    font-family: "Charter", "Iowan Old Style", Georgia, serif;
    background: #fff;
    color: #1a1a1a;
    margin: 3rem auto;
    max-width: 38rem;
    line-height: 1.65;
  }
  h1 { font-weight: 500; font-size: 2rem; letter-spacing: -.01em; margin-bottom: 1.5rem; }
  p { font-size: 1.0625rem; }
</style>
</head>
<body>
  <h1>Variant 2: Editorial Serif</h1>
  <p>Measured column width, reading-optimised serif, generous line-height. The "long-form content" stance.</p>
  <p>Hypothesis: users pick this when the product is primarily <em>reading</em> (docs, articles, manuals).</p>
</body>
</html>
