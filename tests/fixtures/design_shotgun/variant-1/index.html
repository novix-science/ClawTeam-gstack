<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Variant 1 — Minimal Monospace</title>
<style>
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: #fafafa;
    color: #222;
    margin: 2rem;
    line-height: 1.55;
  }
  h1 { font-size: 1.5rem; border-bottom: 1px solid #ddd; padding-bottom: .5rem; }
  code { background: #eee; padding: 0 .25rem; }
</style>
</head>
<body>
  <h1>Variant 1: Minimal Monospace</h1>
  <p>Clean, readable, no frills. System-mono stack, off-white background, hairline header rule.</p>
  <p>Hypothesis: users pick this when they value <code>legibility</code> over visual flair.</p>
</body>
</html>
