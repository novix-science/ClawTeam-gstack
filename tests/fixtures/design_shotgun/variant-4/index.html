<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Variant 4 — Playful Warm</title>
<style>
  body {
    font-family: "Nunito", "Avenir Next", system-ui, sans-serif;
    background: #fff7ed;
    color: #431407;
    margin: 0;
    padding: 2.5rem;
  }
  h1 {
    font-size: 2rem;
    font-weight: 900;
    color: #ea580c;
    text-transform: uppercase;
    letter-spacing: .02em;
  }
  .card {
    background: #fffbeb;
    border: 2px solid #fdba74;
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.08);
    max-width: 36rem;
  }
</style>
</head>
<body>
  <h1>Variant 4: Playful Warm</h1>
  <div class="card">
    <p>Soft peach background, rounded card with warm border + subtle shadow, uppercase display weight.</p>
    <p>Hypothesis: users pick this when the product is consumer-facing and wants to feel <strong>friendly</strong> rather than austere.</p>
  </div>
</body>
</html>
