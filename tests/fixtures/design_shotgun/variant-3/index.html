<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Variant 3 — Vivid Dark Mode</title>
<style>
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    color: #f1f5f9;
    margin: 0;
    padding: 3rem 2rem;
    min-height: 100vh;
  }
  h1 {
    font-size: 2.25rem;
    font-weight: 800;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { max-width: 40rem; opacity: .9; }
  a { color: #38bdf8; text-decoration: none; border-bottom: 1px dashed #38bdf8; }
</style>
</head>
<body>
  <h1>Variant 3: Vivid Dark Mode</h1>
  <p>Slate-to-navy gradient, cyan-violet gradient headings, high-contrast sans. Energetic, tech-forward.</p>
  <p>Hypothesis: users pick this when the product is an <a href="#">engineer tool</a> or late-night creative workflow.</p>
</body>
</html>
